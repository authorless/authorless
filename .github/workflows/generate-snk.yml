name: Generate contribution animation

on:
  schedule:
    # 03:25 MSK (Moscow is UTC+3 year-round).
    - cron: "25 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/generate-snake.mjs"
      - ".github/workflows/generate-snk.yml"

concurrency:
  group: contribution-animation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Install the pinned Snake renderer
        run: npm install --no-save --ignore-scripts generate-snake-animation@3.5.0

      - name: Generate the one-year light and dark SVG files
        env:
          # read:user lets GraphQL include private contribution counts. The
          # generator also merges GitHub's public profile calendar so PR
          # reviews such as the 2025-11-16 contribution are not omitted.
          SNAKE_TOKEN: ${{ secrets.SNAKE_READ_USER_TOKEN || github.token }}
        run: node .github/scripts/generate-snake.mjs

      - name: Publish SVG files to the output branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          publish_dir="$(mktemp -d)"
          cp -a dist/. "$publish_dir/"
          cd "$publish_dir"

          git init
          git checkout --orphan output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: update contribution snake"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:output
