name: Generate contribution animation

on:
  schedule:
    # 03:25 MSK (Moscow is UTC+3 year-round).
    - cron: "25 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-snk.yml"

concurrency:
  group: contribution-animation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Generate light and dark SVG files
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F59E0B&color_dots=#EBEDF0,#FDE68A,#FBBF24,#F59E0B,#D97706
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F59E0B&color_dots=#161B22,#452F0A,#7A4F0B,#B86F0B,#F59E0B

      - name: Publish SVG files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
